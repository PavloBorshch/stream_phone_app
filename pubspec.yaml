name: stream_phone_cam
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.0.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  google_sign_in: ^7.2.0
  flutter_webrtc: ^1.6.0
  mobile_scanner: ^7.4.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  wakelock_plus: ^1.7.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

# Local patch for PLAN.md's "Leg A" (phone -> paired PC video over WebRTC) --
# see third_party/flutter_webrtc/PATCH_NOTES.md for exactly what and why.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

flutter:
  uses-material-design: true
